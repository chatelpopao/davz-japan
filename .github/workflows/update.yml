name: Update & deploy

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Tout retélécharger"
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get install -y libcairo2 >/dev/null
          pip install -r pipeline/requirements.txt

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            site/img/clubs
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Fetch data
        run: python pipeline/build.py ${{ inputs.full && '--full' || '' }}

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            site/img/clubs
          key: data-${{ github.run_id }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.40.0"
          command: deploy
